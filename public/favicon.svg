<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 1. 无圆角铺满背景底板 -->
  <rect width="512" height="512" fill="#F7F5F0" />

  <!-- 2. 底部克莱因蓝装饰 (呼应现代主题) -->
  <ellipse cx="256" cy="354" rx="76" ry="46" fill="#2447C8" />

  <!-- 3. 大耳朵 (巧克力暗褐 #2B2523) -->
  <g fill="#2B2523">
    <!-- 左耳 -->
    <circle cx="156" cy="142" r="48" />
    <!-- 右耳 -->
    <circle cx="356" cy="142" r="48" />
  </g>
  <!-- 粉色内耳 -->
  <g fill="#FFA6B5">
    <circle cx="152" cy="142" r="28" />
    <circle cx="360" cy="142" r="28" />
  </g>

  <!-- 4. 底部露出的左下小胖脚 -->
  <path d="M 174 386 Q 164 424 196 424 C 214 424 218 398 214 382 Z" fill="#F2D0BD" stroke="#2B2523" stroke-width="15" stroke-linejoin="round" />
  <path d="M 188 412 V 422 M 200 410 V 420" fill="none" stroke="#2B2523" stroke-width="6" stroke-linecap="round" />

  <!-- 5. 胖乎乎的头部 -->
  <ellipse cx="256" cy="226" rx="124" ry="94" fill="#2B2523" />

  <!-- 6. 巨型 puffy 腮颊 (白色 + 深色外描边) -->
  <!-- 左颊 -->
  <ellipse cx="172" cy="312" rx="98" ry="92" fill="#FFFFFF" stroke="#2B2523" stroke-width="16" />
  <!-- 右颊 -->
  <ellipse cx="328" cy="312" rx="92" ry="86" fill="#FFFFFF" stroke="#2B2523" stroke-width="16" />
  <!-- 覆盖颊间重合的多余描边 -->
  <ellipse cx="256" cy="320" rx="42" ry="48" fill="#FFFFFF" />

  <!-- 7. 腮红 (半透明粉) -->
  <ellipse cx="120" cy="290" rx="36" ry="24" fill="#FFA6B5" opacity="0.8" />
  <ellipse cx="370" cy="286" rx="34" ry="22" fill="#FFA6B5" opacity="0.8" />

  <!-- 8. 星光灵动大眼 (白色高光) -->
  <g fill="#FFFFFF">
    <!-- 左眼 -->
    <circle cx="214" cy="226" r="16" />
    <!-- 左眼内星光 -->
    <circle cx="206" cy="216" r="5" />
    <polygon points="216,234 219,237 216,240 213,237" />
    
    <!-- 右眼 -->
    <circle cx="298" cy="226" r="16" />
    <!-- 右眼内星光 -->
    <circle cx="290" cy="216" r="5" />
    <polygon points="302,234 305,237 302,240 299,237" />
  </g>

  <!-- 9. 鼻子与 W 状嘴巴 -->
  <ellipse cx="256" cy="242" rx="10" ry="7" fill="#2B2523" />
  <path d="M 256 248 V 254 Q 242 268 228 254 M 256 254 Q 270 268 284 254" fill="none" stroke="#2B2523" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 10. 巨型星纹金币 (Stash 囤积) -->
  <g stroke="#2B2523" stroke-linejoin="round">
    <!-- 外圆 -->
    <circle cx="346" cy="308" r="62" fill="#E2A400" stroke-width="16" />
    <!-- 内圆 -->
    <circle cx="346" cy="308" r="46" fill="#F8CA28" stroke-width="10" />
    <!-- 压纹星 -->
    <polygon points="346,278 355,296 374,299 360,312 363,331 346,322 329,331 332,312 318,299 337,296" fill="#D18700" stroke="#D18700" stroke-width="6" />
  </g>

  <!-- 11. 抓金币的右手小胖爪 -->
  <path d="M 386 322 Q 408 342 382 364 C 366 378 354 354 366 338 Z" fill="#F2D0BD" stroke="#2B2523" stroke-width="14" stroke-linejoin="round" />
  <path d="M 384 340 L 372 352 M 394 348 L 382 360" fill="none" stroke="#2B2523" stroke-width="6" stroke-linecap="round" />
</svg>