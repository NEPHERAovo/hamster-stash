<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="集日常收支、物品收纳与资产管理于一体的轻量化个人账本" />
    <meta name="application-name" content="仓鼠囤囤" />
    <meta name="apple-mobile-web-app-title" content="仓鼠囤囤" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F4F6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090A0D" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="仓鼠囤囤" />
    <meta property="og:description" content="集日常收支、物品收纳与资产管理于一体的轻量化个人账本" />
    <meta property="og:site_name" content="仓鼠囤囤" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <title>仓鼠囤囤</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('hamsterstash_color_mode_v1');
          var cachedLightBg = localStorage.getItem('hamsterstash_splash_bg_light_v1');
          var cachedDarkBg = localStorage.getItem('hamsterstash_splash_bg_dark_v1');
          var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var effectiveMode = (mode === 'light' || mode === 'dark' || mode === 'auto') ? mode : 'light';
          var isDark = effectiveMode === 'dark' || (effectiveMode === 'auto' && sysDark);
          var lightBg = cachedLightBg || '#F3F4F6';
          var darkBg = cachedDarkBg || '#090A0D';
          var bg = isDark ? darkBg : lightBg;
          var fg = isDark ? '#F5F6F8' : '#111318';
          var muted = isDark ? 'rgba(245,246,248,0.45)' : 'rgba(17,19,24,0.45)';
          var track = isDark ? 'rgba(255,255,255,0.12)' : 'rgba(17,19,24,0.1)';
          var root = document.documentElement;
          root.style.setProperty('--splash-bg', bg);
          root.style.setProperty('--splash-fg', fg);
          root.style.setProperty('--splash-muted', muted);
          root.style.setProperty('--splash-track', track);
          root.style.backgroundColor = bg;
          root.style.colorScheme = isDark ? 'dark' : 'light';
          if (isDark) root.classList.add('dark');
          var colorSchemeMeta = document.querySelector('meta[name="color-scheme"]');
          if (colorSchemeMeta) {
            colorSchemeMeta.setAttribute('content', effectiveMode === 'auto' ? 'light dark' : effectiveMode);
          }
          var lightMeta = document.querySelector('meta[name="theme-color"][media="(prefers-color-scheme: light)"]');
          var darkMeta = document.querySelector('meta[name="theme-color"][media="(prefers-color-scheme: dark)"]');
          if (lightMeta) lightMeta.setAttribute('content', bg);
          if (darkMeta) darkMeta.setAttribute('content', bg);
        } catch (e) {}
      })();

      window.__splashErrorDetails = null;
      function handleSplashCatch(err, source, lineno, colno) {
        var str = '';
        if (err && err.stack) {
          str = err.stack;
        } else if (err && err.message) {
          str = (err.name ? err.name + ': ' : '') + err.message;
        } else {
          str = String(err || 'Unknown error');
        }
        if (source) {
          str += '\n  at ' + source + ':' + lineno + ':' + colno;
        }
        window.__splashErrorDetails = str;
        var box = document.getElementById('splash-error-box');
        if (box) {
          var pre = document.getElementById('splash-error-pre');
          if (pre) pre.textContent = str;
          box.style.display = 'block';
          var track = document.getElementById('splash-track');
          if (track) track.style.display = 'none';
          var fallback = document.getElementById('splash-fallback');
          if (fallback) fallback.style.display = 'none';
        }
      }

      window.addEventListener('error', function (e) {
        handleSplashCatch(e.error || e.message, e.filename, e.lineno, e.colno);
      });
      window.addEventListener('unhandledrejection', function (e) {
        handleSplashCatch(e.reason);
      });

      async function forceRepairAndReload(resetDb) {
        if (resetDb) {
          if (!confirm('确定要清空全部数据库并重置吗？此操作将抹去本地记账数据。建议先导出备份。')) {
            return;
          }
          if (!confirm('请再次确认：此操作不可逆，将彻底删除所有本地数据。确认清空？')) {
            return;
          }
        }
        var status = document.getElementById('splash-status-text') || document.getElementById('splash-error-status');
        if (status) {
          status.style.display = 'block';
          status.textContent = '正在清理缓存与离线服务...';
        }
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            for (var i = 0; i < regs.length; i++) {
              await regs[i].unregister();
            }
          }
          if ('caches' in window) {
            var keys = await caches.keys();
            for (var j = 0; j < keys.length; j++) {
              await caches.delete(keys[j]);
            }
          }
          sessionStorage.clear();
          if (resetDb) {
            localStorage.clear();
            if ('indexedDB' in window) {
              try { indexedDB.deleteDatabase('hamsterStash_db'); } catch (e) {}
              try { indexedDB.deleteDatabase('hamsterStash_sandbox_db'); } catch (e) {}
            }
          }
        } catch (err) {
          console.error(err);
        }
        if (status) status.textContent = '清理完成，正在拉取最新版本...';
        var u = new URL(window.location.origin + window.location.pathname);
        u.searchParams.set('_v', Date.now().toString());
        window.location.replace(u.toString());
      }

      async function exportEmergencyCsv() {
        var status = document.getElementById('splash-status-text') || document.getElementById('splash-error-status');
        if (status) {
          status.style.display = 'block';
          status.textContent = '正在导出账单 CSV...';
        }
        try {
          var transactions = [];
          var categories = {};
          var accounts = {};
          if ('indexedDB' in window) {
            var req = indexedDB.open('hamsterStash_db');
            await new Promise(function (resolve) {
              req.onsuccess = function (e) {
                var db = e.target.result;
                var pending = 3;
                function checkDone() {
                  pending--;
                  if (pending <= 0) {
                    db.close();
                    resolve();
                  }
                }
                function readStore(name, cb) {
                  if (!db.objectStoreNames.contains(name)) {
                    checkDone();
                    return;
                  }
                  try {
                    var tx = db.transaction(name, 'readonly');
                    var st = tx.objectStore(name);
                    var getAllReq = st.getAll();
                    getAllReq.onsuccess = function () {
                      cb(getAllReq.result || []);
                      checkDone();
                    };
                    getAllReq.onerror = function () { checkDone(); };
                  } catch (err) { checkDone(); }
                }
                readStore('transactions', function (items) { transactions = items; });
                readStore('categories', function (items) {
                  for (var i = 0; i < items.length; i++) categories[items[i].id] = items[i].name;
                });
                readStore('accounts', function (items) {
                  for (var i = 0; i < items.length; i++) accounts[items[i].id] = items[i].name;
                });
              };
              req.onerror = function () { resolve(); };
            });
          }

          function typeLabel(t) {
            if (t === 'income') return '收入';
            if (t === 'transfer') return '转账';
            if (t === 'loan') return '借贷';
            if (t === 'reconcile') return '平账';
            return '支出';
          }
          function escapeCsv(val) {
            var s = String(val == null ? '' : val);
            if (s.indexOf('"') !== -1 || s.indexOf(',') !== -1 || s.indexOf('\n') !== -1 || s.indexOf('\r') !== -1) {
              return '"' + s.replace(/"/g, '""') + '"';
            }
            return '"' + s + '"';
          }

          var headers = ['日期', '分类名称', '收支', '金额', '账户', '备注', '是否报销', '凭证名称'];
          var lines = [headers.map(escapeCsv).join(',')];
          for (var i = 0; i < transactions.length; i++) {
            var t = transactions[i];
            var amountStr = typeof t.amount === 'number' ? (t.amount / 100).toFixed(2) : '0.00';
            var row = [
              t.date || '',
              categories[t.categoryId] || '其它',
              typeLabel(t.type),
              amountStr,
              accounts[t.accountId] || '默认账户',
              t.note || '',
              t.isReimbursable ? '是' : '否',
              (t.voucher && t.voucher.name) || ''
            ];
            lines.push(row.map(escapeCsv).join(','));
          }
          var csvContent = '\uFEFF' + lines.join('\r\n');
          var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'hamsterstash_records_' + new Date().toISOString().slice(0, 10) + '.csv';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          if (status) status.textContent = '账单 CSV 已成功导出！';
        } catch (err) {
          alert('CSV 导出失败: ' + err);
        }
      }

      async function exportEmergencyData() {
        var status = document.getElementById('splash-status-text') || document.getElementById('splash-error-status');
        if (status) {
          status.style.display = 'block';
          status.textContent = '正在导出本地数据...';
        }
        try {
          var dump = { exportedAt: new Date().toISOString(), localStorage: Object.assign({}, localStorage) };
          if ('indexedDB' in window) {
            var req = indexedDB.open('hamsterStash_db');
            await new Promise(function (resolve) {
              req.onsuccess = function (e) {
                var db = e.target.result;
                var names = Array.from(db.objectStoreNames);
                if (names.length === 0) {
                  db.close();
                  resolve();
                  return;
                }
                var completed = 0;
                for (var i = 0; i < names.length; i++) {
                  (function (storeName) {
                    try {
                      var tx = db.transaction(storeName, 'readonly');
                      var st = tx.objectStore(storeName);
                      var getAllReq = st.getAll();
                      getAllReq.onsuccess = function () {
                        dump[storeName] = getAllReq.result;
                        completed++;
                        if (completed >= names.length) {
                          db.close();
                          resolve();
                        }
                      };
                      getAllReq.onerror = function () {
                        completed++;
                        if (completed >= names.length) {
                          db.close();
                          resolve();
                        }
                      };
                    } catch (err) {
                      completed++;
                      if (completed >= names.length) {
                        db.close();
                        resolve();
                      }
                    }
                  })(names[i]);
                }
              };
              req.onerror = function () { resolve(); };
            });
          }
          var blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'hamsterstash_backup_' + new Date().toISOString().slice(0, 10) + '.json';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          if (status) status.textContent = '数据已导出，可安全点击清空重置。';
        } catch (err) {
          alert('数据导出失败: ' + err);
        }
      }

      function copySplashDiagnostics() {
        var err = window.__splashErrorDetails || '无捕获到的错误信息';
        var info = [
          'Error: ' + err,
          'UserAgent: ' + (navigator.userAgent || 'unknown'),
          'URL: ' + window.location.href,
          'Time: ' + new Date().toISOString(),
          'Screen: ' + window.innerWidth + 'x' + window.innerHeight,
        ].join('\n\n');

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(info).then(function () {
            alert('运行诊断与报错信息已复制');
          }).catch(function () {
            prompt('请手动长按复制报错信息：', info);
          });
        } else {
          prompt('请手动长按复制报错信息：', info);
        }
      }
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: var(--splash-bg, #F3F4F6);
      }
      .app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background-color: var(--splash-bg, #F3F4F6);
        color: var(--splash-fg, #111318);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      .app-splash-icon {
        width: 58px;
        height: 58px;
        border-radius: 16px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        animation: splashPulse 1.8s ease-in-out infinite;
      }
      .app-splash-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .app-splash-track {
        width: 88px;
        height: 3px;
        border-radius: 9999px;
        background: var(--splash-track, rgba(17, 19, 24, 0.1));
        overflow: hidden;
      }
      .app-splash-bar {
        width: 40%;
        height: 100%;
        border-radius: 9999px;
        background: var(--splash-muted, rgba(17, 19, 24, 0.45));
        animation: splashSlide 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(0.96); opacity: 1; }
      }
      @keyframes splashSlide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-splash" aria-label="应用加载中">
        <img class="app-splash-icon" src="/pwa-192x192.png" alt="仓鼠囤囤" width="58" height="58" />
        <div class="app-splash-title">仓鼠囤囤</div>
        <div class="app-splash-track" id="splash-track">
          <div class="app-splash-bar"></div>
        </div>

        <div id="splash-error-box" style="display:none;max-width:340px;width:90%;margin-top:14px;padding:14px;border:1px solid rgba(239,68,68,0.3);border-radius:14px;background:rgba(239,68,68,0.06);color:inherit;font-size:12px;text-align:left;box-sizing:border-box;">
          <div style="font-weight:bold;color:#ef4444;margin-bottom:6px;display:flex;align-items:center;gap:6px;">
            <span>⚠️</span>
            <span>启动异常拦截</span>
          </div>
          <div id="splash-error-status" style="font-size:11px;margin-bottom:6px;color:#1677ff;display:none;"></div>
          <pre id="splash-error-pre" style="max-height:100px;overflow:auto;font-size:10px;line-height:1.4;background:rgba(0,0,0,0.05);padding:6px;border-radius:6px;margin:6px 0;word-break:break-all;white-space:pre-wrap;user-select:text;-webkit-user-select:text;"></pre>
          <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">
            <button type="button" onclick="exportEmergencyCsv()" style="width:100%;height:34px;background:rgba(0,0,0,0.06);border:1px solid currentColor;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;color:inherit;">导出账单明细 (CSV)</button>
            <button type="button" onclick="exportEmergencyData()" style="width:100%;height:34px;background:rgba(0,0,0,0.06);border:1px solid currentColor;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;color:inherit;">导出当前数据 (JSON)</button>
            <button type="button" onclick="copySplashDiagnostics()" style="width:100%;height:32px;background:rgba(0,0,0,0.03);border:1px solid currentColor;border-radius:8px;font-size:11px;cursor:pointer;color:inherit;">复制报错与诊断</button>
            <button type="button" onclick="forceRepairAndReload(false)" style="width:100%;height:32px;background:rgba(0,0,0,0.03);border:1px solid currentColor;border-radius:8px;font-size:11px;cursor:pointer;color:inherit;">清除缓存并重试</button>
            <button type="button" onclick="forceRepairAndReload(true)" style="width:100%;height:32px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.3);color:#ef4444;border-radius:8px;font-size:11px;font-weight:500;cursor:pointer;">清空数据库并重置</button>
          </div>
        </div>

        <div id="splash-fallback" style="display:none;max-width:320px;width:88%;margin-top:16px;text-align:center;font-size:12px;opacity:0.9;box-sizing:border-box;">
          <div style="margin-bottom:8px;font-weight:500;">加载时间较长？</div>
          <div id="splash-status-text" style="font-size:11px;margin-bottom:8px;color:#1677ff;display:none;"></div>
          <div style="display:flex;flex-direction:column;gap:8px;width:100%;">
            <button type="button" onclick="exportEmergencyCsv()" style="width:100%;height:32px;background:rgba(0,0,0,0.05);border:1px solid currentColor;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;color:inherit;">导出账单明细 (CSV)</button>
            <button type="button" onclick="exportEmergencyData()" style="width:100%;height:32px;background:rgba(0,0,0,0.05);border:1px solid currentColor;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;color:inherit;">导出当前数据 (JSON)</button>
            <button type="button" onclick="forceRepairAndReload(false)" style="width:100%;height:32px;background:transparent;border:1px solid currentColor;border-radius:8px;font-size:11px;cursor:pointer;color:inherit;">清除缓存重载</button>
            <button type="button" onclick="forceRepairAndReload(true)" style="width:100%;height:32px;background:transparent;border:1px dashed #ef4444;color:#ef4444;border-radius:8px;font-size:11px;cursor:pointer;">清空数据库重置</button>
            <button type="button" onclick="copySplashDiagnostics()" style="width:100%;height:28px;background:transparent;border:none;font-size:11px;cursor:pointer;color:inherit;opacity:0.75;">复制运行诊断</button>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        setTimeout(function () {
          var fb = document.getElementById('splash-fallback');
          var errBox = document.getElementById('splash-error-box');
          if (fb && (!errBox || errBox.style.display === 'none')) {
            fb.style.display = 'block';
          }
        }, 4000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
